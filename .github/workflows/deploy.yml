name: Deploy to Oracle

# Builds the three images in GitHub (the 1 GB server must never compile anything),
# pushes them to GHCR and rolls the stack on the Oracle VM over SSH.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: { group: deploy, cancel-in-progress: false }

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.c.outputs.ready }}
    steps:
      - id: c
        env: { HOST: "${{ secrets.OCI_HOST }}", KEY: "${{ secrets.OCI_SSH_KEY }}" }
        run: |
          if [ -n "$HOST" ] && [ -n "$KEY" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "::notice::Deploy skipped: set OCI_HOST / OCI_USER / OCI_SSH_KEY / GHCR_PULL_TOKEN secrets"; fi

  deploy:
    needs: check
    if: ${{ needs.check.outputs.ready == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    env:
      PREFIX: ghcr.io/${{ github.repository_owner }}/project-tiktok
    steps:
      - uses: actions/checkout@v4
      - name: Lower-case image prefix
        run: echo "PREFIX=$(echo "$PREFIX" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.PREFIX }}/backend:${{ github.sha }},${{ env.PREFIX }}/backend:latest
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.PREFIX }}/frontend:${{ github.sha }},${{ env.PREFIX }}/frontend:latest
          build-args: VITE_API_URL=/api/v1
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - uses: docker/build-push-action@v6
        with:
          context: zalo-bridge
          push: true
          tags: ${{ env.PREFIX }}/zalo-bridge:${{ github.sha }},${{ env.PREFIX }}/zalo-bridge:latest
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,mode=max,scope=bridge

      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts

      - name: Ship compose files
        run: scp -i ~/.ssh/id_deploy deploy/docker-compose.prod.yml deploy/Caddyfile deploy/maintenance.sh deploy/install-maintenance.sh "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/opt/kocflow/"

      - name: Roll out
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/kocflow
          # host maintenance: watchdog every 3 min + weekly cleanup (replaces the old local-Mongo backup cron)
          sudo bash /opt/kocflow/install-maintenance.sh || echo "warning: maintenance job not installed"
          sudo mkdir -p .maint && sudo touch .maint/deploying   # tells the watchdog to stand down while we roll
          sed -i '/^IMAGE_TAG=/d' .env && echo "IMAGE_TAG=${{ github.sha }}" >> .env
          echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin
          docker compose -f docker-compose.prod.yml --env-file .env pull
          docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
          docker image prune -f
          for i in $(seq 1 30); do
            docker compose -f docker-compose.prod.yml exec -T backend wget -qO- http://127.0.0.1:5000/health >/dev/null 2>&1 && { sudo rm -f .maint/deploying; echo "healthy"; exit 0; }
            sleep 3
          done
          docker compose -f docker-compose.prod.yml logs --tail 50 backend
          exit 1
          REMOTE
